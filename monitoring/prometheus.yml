# Prometheus config for Hari Bhari Mandi (no Docker)
# Run from this folder:  ./prometheus --config.file=prometheus.yml
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'produce-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['localhost:8081']

  - job_name: 'order-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['localhost:8082']
